name: demo

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Overbuilt starting point passes
        run: python demo/check.py demo/before
      - name: Reference trimmed version passes
        run: python demo/check.py demo/after
